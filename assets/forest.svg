<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Forest plot of AURC difference versus the strongest baseline across nine cohorts">
  <defs>
    <style>
      .t    { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2937; }
      .cohort { font-size:12.5px; }
      .val  { font-size:12px; fill:#5b6b7b; }
      .tick { font-size:11.5px; fill:#5b6b7b; }
      .axis { font-size:12px; fill:#5b6b7b; }
      .sig  { stroke:#1f5c99; stroke-width:1.6; }
      .ns   { stroke:#a9b4c0; stroke-width:1.6; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>

  <!-- column heads -->
  <text class="t tick" x="212" y="40" text-anchor="end">Cohort</text>
  <text class="t tick" x="770" y="40" text-anchor="end">&#916;AURC</text>

  <!-- zero line -->
  <path d="M 607.4 46 L 607.4 352" stroke="#c8d0d8" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>

  <!-- rows -->
  <!-- i=0 Seamless French stress -->
  <path class="sig" d="M 292.1 68 L 398.2 68"/>
  <path class="sig" d="M 292.1 62 L 292.1 74"/>
  <path class="sig" d="M 398.2 62 L 398.2 74"/>
  <circle cx="346.9" cy="68" r="4.2" fill="#1f5c99"/>
  <text class="t cohort" x="212" y="72" text-anchor="end">Seamless FR stress</text>
  <text class="t val" x="770" y="72" text-anchor="end">-0.0538</text>

  <!-- i=1 Seamless controlled -->
  <path class="sig" d="M 235.5 100 L 511.5 100"/>
  <path class="sig" d="M 235.5 94 L 235.5 106"/>
  <path class="sig" d="M 511.5 94 L 511.5 106"/>
  <circle cx="378.3" cy="100" r="4.2" fill="#1f5c99"/>
  <text class="t cohort" x="212" y="104" text-anchor="end">Seamless controlled</text>
  <text class="t val" x="770" y="104" text-anchor="end">-0.0473</text>

  <!-- i=2 Qwen French stress -->
  <path class="sig" d="M 408.8 132 L 503.3 132"/>
  <path class="sig" d="M 408.8 126 L 408.8 138"/>
  <path class="sig" d="M 503.3 126 L 503.3 138"/>
  <circle cx="456.8" cy="132" r="4.2" fill="#1f5c99"/>
  <text class="t cohort" x="212" y="136" text-anchor="end">Qwen FR stress</text>
  <text class="t val" x="770" y="136" text-anchor="end">-0.0311</text>

  <!-- i=3 Qwen controlled -->
  <path class="sig" d="M 448.1 164 L 559.9 164"/>
  <path class="sig" d="M 448.1 158 L 448.1 170"/>
  <path class="sig" d="M 559.9 158 L 559.9 170"/>
  <circle cx="509.6" cy="164" r="4.2" fill="#1f5c99"/>
  <text class="t cohort" x="212" y="168" text-anchor="end">Qwen controlled</text>
  <text class="t val" x="770" y="168" text-anchor="end">-0.0202</text>

  <!-- i=4 Qwen German stress -->
  <path class="sig" d="M 499.9 196 L 595.8 196"/>
  <path class="sig" d="M 499.9 190 L 499.9 202"/>
  <path class="sig" d="M 595.8 190 L 595.8 202"/>
  <circle cx="550.2" cy="196" r="4.2" fill="#1f5c99"/>
  <text class="t cohort" x="212" y="200" text-anchor="end">Qwen DE stress</text>
  <text class="t val" x="770" y="200" text-anchor="end">-0.0118</text>

  <!-- i=5 Qwen German clean -->
  <path class="ns" d="M 537.2 228 L 609.3 228"/>
  <path class="ns" d="M 537.2 222 L 537.2 234"/>
  <path class="ns" d="M 609.3 222 L 609.3 234"/>
  <circle cx="579.8" cy="228" r="4.2" fill="#ffffff" stroke="#a9b4c0" stroke-width="1.6"/>
  <text class="t cohort" x="212" y="232" text-anchor="end">Qwen DE clean</text>
  <text class="t val" x="770" y="232" text-anchor="end">-0.0057</text>

  <!-- i=6 Seamless French clean -->
  <path class="ns" d="M 529.9 260 L 621.9 260"/>
  <path class="ns" d="M 529.9 254 L 529.9 266"/>
  <path class="ns" d="M 621.9 254 L 621.9 266"/>
  <circle cx="583.6" cy="260" r="4.2" fill="#ffffff" stroke="#a9b4c0" stroke-width="1.6"/>
  <text class="t cohort" x="212" y="264" text-anchor="end">Seamless FR clean</text>
  <text class="t val" x="770" y="264" text-anchor="end">-0.0049</text>

  <!-- i=7 Qwen French clean -->
  <path class="ns" d="M 577.8 292 L 638.4 292"/>
  <path class="ns" d="M 577.8 286 L 577.8 298"/>
  <path class="ns" d="M 638.4 286 L 638.4 298"/>
  <circle cx="606.4" cy="292" r="4.2" fill="#ffffff" stroke="#a9b4c0" stroke-width="1.6"/>
  <text class="t cohort" x="212" y="296" text-anchor="end">Qwen FR clean</text>
  <text class="t val" x="770" y="296" text-anchor="end">-0.0002</text>

  <!-- i=8 Seamless German clean -->
  <path class="ns" d="M 598.2 324 L 651.4 324"/>
  <path class="ns" d="M 598.2 318 L 598.2 330"/>
  <path class="ns" d="M 651.4 318 L 651.4 330"/>
  <circle cx="619" cy="324" r="4.2" fill="#ffffff" stroke="#a9b4c0" stroke-width="1.6"/>
  <text class="t cohort" x="212" y="328" text-anchor="end">Seamless DE clean</text>
  <text class="t val" x="770" y="328" text-anchor="end">+0.0024</text>

  <!-- axis -->
  <path d="M 220 352 L 680 352" stroke="#b9c3cd" stroke-width="1.2" fill="none"/>
  <path d="M 220 352 L 220 346" stroke="#b9c3cd" stroke-width="1.2"/>
  <path d="M 316.8 352 L 316.8 346" stroke="#b9c3cd" stroke-width="1.2"/>
  <path d="M 413.7 352 L 413.7 346" stroke="#b9c3cd" stroke-width="1.2"/>
  <path d="M 510.5 352 L 510.5 346" stroke="#b9c3cd" stroke-width="1.2"/>
  <path d="M 607.4 352 L 607.4 346" stroke="#b9c3cd" stroke-width="1.2"/>

  <text class="t tick" x="220" y="370" text-anchor="middle">-0.08</text>
  <text class="t tick" x="316.8" y="370" text-anchor="middle">-0.06</text>
  <text class="t tick" x="413.7" y="370" text-anchor="middle">-0.04</text>
  <text class="t tick" x="510.5" y="370" text-anchor="middle">-0.02</text>
  <text class="t tick" x="607.4" y="370" text-anchor="middle">0</text>
  <text class="t axis" x="450" y="392" text-anchor="middle">&#916;AURC vs the strongest baseline (negative = better)</text>

  <!-- legend -->
  <circle cx="52" cy="371" r="4.2" fill="#1f5c99"/>
  <text class="t tick" x="64" y="375">interval excludes 0</text>
  <circle cx="52" cy="390" r="4.2" fill="#ffffff" stroke="#a9b4c0" stroke-width="1.6"/>
  <text class="t tick" x="64" y="394">interval includes 0</text>
</svg>
